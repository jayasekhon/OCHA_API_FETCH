name: Fetch — Plans

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: 'Plan ID (numeric) — fetches a specific plan'
        required: false
        default: ''
      plan_code:
        description: 'Plan code (e.g. UKR23) — fetches a specific plan'
        required: false
        default: ''
      year:
        description: 'Year (e.g. 2025) — fetches all plans for that year'
        required: false
        default: ''
      country_iso3:
        description: 'Country ISO3 (e.g. SDN) — fetches all plans for that country'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID: ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:  ${{ secrets.FTS_PASSWORD }}
          PLAN_ID:       ${{ github.event.inputs.plan_id || '' }}
          PLAN_CODE:     ${{ github.event.inputs.plan_code || '' }}
          YEAR:          ${{ github.event.inputs.year || '' }}
          COUNTRY:       ${{ github.event.inputs.country_iso3 || '' }}
          FORMAT:        ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          if [ -n "$PLAN_ID" ]; then
            URL="https://api.hpc.tools/v1/public/plan/id/${PLAN_ID}"
            SLUG="plan_id${PLAN_ID}"
          elif [ -n "$PLAN_CODE" ]; then
            URL="https://api.hpc.tools/v1/public/plan/code/${PLAN_CODE}"
            SLUG="plan_${PLAN_CODE,,}"
          elif [ -n "$YEAR" ]; then
            URL="https://api.hpc.tools/v1/public/plan/year/${YEAR}"
            SLUG="plan_${YEAR}"
          elif [ -n "$COUNTRY" ]; then
            URL="https://api.hpc.tools/v1/public/plan/country/${COUNTRY}"
            SLUG="plan_${COUNTRY,,}"
          else
            echo "Error: provide at least one parameter"; exit 1
          fi

          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Saved $(wc -c < "$OUT_FILE") bytes to ${OUT_FILE}"

          # Export paths for subsequent steps
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_ENV
          echo "OUT_FILE=${OUT_FILE}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Convert JSON to Excel
        if: ${{ github.event.inputs.format != 'xml' }}
        run: |
          pip install openpyxl --quiet --break-system-packages
          python3 - << 'PYEOF'
          import json, os, openpyxl, shutil
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          json_path = os.environ["OUT_FILE"]
          out_dir   = os.environ["OUT_DIR"]
          date_str  = os.environ["DATE"]

          if not json_path.endswith(".json"):
              print("Not a JSON file — skipping Excel conversion")
              raise SystemExit(0)

          def style_header(ws):
              fill = PatternFill("solid", fgColor="1F3864")
              font = Font(color="FFFFFF", bold=True)
              for cell in ws[1]:
                  cell.fill = fill
                  cell.font = font
                  cell.alignment = Alignment(horizontal="center")

          def autofit(ws):
              for col in ws.columns:
                  max_len = max((len(str(c.value or "")) for c in col), default=10)
                  ws.column_dimensions[get_column_letter(col[0].column)].width = min(max_len + 4, 60)

          def safe_str_list(items, key="name"):
              """Join a list of objects by a key, safely handling None/non-dict items."""
              if not items:
                  return ""
              parts = []
              for item in items:
                  if isinstance(item, dict):
                      parts.append(str(item.get(key, "")))
                  else:
                      parts.append(str(item))
              return "; ".join(p for p in parts if p)

          def flatten_plan(plan):
              """
              Flatten a plan record into a dict of scalar values.
              Handles both summary records (from /year or /country lists) and
              full records (from /id or /code), which carry extra nested objects.
              Nested lists (locations, categories, emergencies, organizations) are
              collapsed to semicolon-separated name strings.
              """
              plan_type = plan.get("planType") or {}
              if not isinstance(plan_type, dict):
                  plan_type = {}

              # years can be a list of dicts or a list of ints
              years_raw = plan.get("years") or []
              if years_raw and isinstance(years_raw[0], dict):
                  years_str = "; ".join(str(y.get("year", y.get("id", ""))) for y in years_raw)
              else:
                  years_str = "; ".join(str(y) for y in years_raw)

              return {
                  "ID":                    plan.get("id", ""),
                  "Name":                  plan.get("name", ""),
                  "Code":                  plan.get("code", ""),
                  "Plan Type":             plan_type.get("name", ""),
                  "Plan Type Abbreviation": plan_type.get("abbreviation", ""),
                  "Start Date":            (plan.get("startDate") or "")[:10],
                  "End Date":              (plan.get("endDate") or "")[:10],
                  "Year(s)":               years_str,
                  "Revised Requirements":  plan.get("revisedRequirements", ""),
                  "Funding Coverage (%)":  plan.get("percentFunded", ""),
                  "Locations":             safe_str_list(plan.get("locations")),
                  "Location ISO3s":        safe_str_list(plan.get("locations"), key="iso3"),
                  "Categories":            safe_str_list(plan.get("categories")),
                  "Emergencies":           safe_str_list(plan.get("emergencies")),
                  "Organisations":         safe_str_list(plan.get("organizations") or plan.get("organisations")),
                  "Custom Location Code":  plan.get("customLocationCode", ""),
                  "Is HPC":                plan.get("isForHPCProjects", ""),
              }

          print(f"Converting: {json_path}")
          with open(json_path) as f:
              raw = json.load(f)

          # Plan endpoints return either:
          #   {"data": [...]}  — list (year/country sub-endpoints)
          #   {"data": {...}}  — single object (id/code sub-endpoints)
          data = raw.get("data", raw)

          if isinstance(data, dict):
              # Single plan response — wrap in a list
              records = [data]
          elif isinstance(data, list):
              records = data
          else:
              print(f"Unexpected data type: {type(data).__name__}")
              raise SystemExit(1)

          flat_rows = [flatten_plan(p) for p in records]

          wb = openpyxl.Workbook()
          ws = wb.active
          ws.title = "Plans"

          if flat_rows:
              headers = list(flat_rows[0].keys())
              ws.append(headers)
              for row in flat_rows:
                  ws.append([row.get(h, "") for h in headers])
              style_header(ws)
              autofit(ws)
              ws.freeze_panes = "A2"

          xlsx_path = os.path.join(out_dir, f"{date_str}.xlsx")
          wb.save(xlsx_path)
          shutil.copy(xlsx_path, os.path.join(out_dir, "latest.xlsx"))
          print(f"Saved {len(flat_rows)} rows → {xlsx_path}")
          PYEOF

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-data-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}/${{ env.DATE }}.xlsx
          if-no-files-found: warn

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
              for slug in sorted(os.listdir(base)):
                  p = os.path.join(base, slug)
                  if not os.path.isdir(p):
                      continue
                  files = sorted(
                      f for f in os.listdir(p)
                      if not f.startswith("latest") and not f.startswith(".")
                  )
                  if not files:
                      continue
                  def ext_priority(fn):
                      e = fn.rsplit(".", 1)[-1]
                      return {"json": 0, "xlsx": 1, "xml": 2}.get(e, 3)
                  latest_file = sorted(files, key=ext_priority)[0]
                  ext = latest_file.rsplit(".", 1)[-1]
                  index[slug] = {
                      "latest":  f"{slug}/latest.{ext}",
                      "files":   [f"{slug}/{f}" for f in files],
                      "updated": latest_file.rsplit(".", 1)[0],
                  }
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
              json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: plan $(date -u +%Y-%m-%d)"
          git push
