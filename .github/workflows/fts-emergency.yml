name: FTS — Emergencies

on:
  workflow_call:
    inputs:
      emergency_id:
        required: false
        type: string
        default: ''
      year:
        required: false
        type: string
        default: ''
      country_iso3:
        required: false
        type: string
        default: ''
      format:
        required: false
        type: string
        default: 'json'
    secrets:
      FTS_CLIENT_ID:
        required: false
      FTS_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      emergency_id:
        description: 'Emergency ID (numeric) — leave blank to fetch by year/country'
        required: false
        default: ''
      year:
        description: 'Year (e.g. 2025)'
        required: false
        default: ''
      country_iso3:
        description: 'Country ISO3 (e.g. SDN, UKR, SYR)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID: ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:  ${{ secrets.FTS_PASSWORD }}
          EMERGENCY_ID:  ${{ github.event.inputs.emergency_id || '' }}
          YEAR:          ${{ github.event.inputs.year || '' }}
          COUNTRY:       ${{ github.event.inputs.country_iso3 || '' }}
          FORMAT:        ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # Route to the correct endpoint
          if [ -n "$EMERGENCY_ID" ]; then
            URL="https://api.hpc.tools/v1/public/emergency/${EMERGENCY_ID}"
            SLUG="emergency_${EMERGENCY_ID}"
          elif [ -n "$COUNTRY" ]; then
            URL="https://api.hpc.tools/v1/public/emergency/country/${COUNTRY}"
            SLUG="emergency_${COUNTRY,,}"
            [ -n "$YEAR" ] && URL="${URL}?year=${YEAR}" && SLUG="${SLUG}_${YEAR}"
          elif [ -n "$YEAR" ]; then
            URL="https://api.hpc.tools/v1/public/emergency/year/${YEAR}"
            SLUG="emergency_${YEAR}"
          else
            echo "Error: provide at least one parameter"; exit 1
          fi

          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Saved $(wc -c < "$OUT_FILE") bytes to ${OUT_FILE}"

          # Export paths for subsequent steps
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_ENV
          echo "OUT_FILE=${OUT_FILE}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Convert JSON to Excel
        if: ${{ github.event.inputs.format != 'xml' }}
        run: |
          pip install openpyxl --quiet --break-system-packages
          python3 - << 'PYEOF'
          import json, os, openpyxl, shutil
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          json_path = os.environ["OUT_FILE"]
          out_dir   = os.environ["OUT_DIR"]
          date_str  = os.environ["DATE"]

          if not json_path.endswith(".json"):
              print("Not a JSON file — skipping Excel conversion")
              raise SystemExit(0)

          def style_header(ws):
              fill = PatternFill("solid", fgColor="1F3864")
              font = Font(color="FFFFFF", bold=True)
              for cell in ws[1]:
                  cell.fill = fill
                  cell.font = font
                  cell.alignment = Alignment(horizontal="center")

          def autofit(ws):
              for col in ws.columns:
                  max_len = max((len(str(c.value or "")) for c in col), default=10)
                  ws.column_dimensions[get_column_letter(col[0].column)].width = min(max_len + 4, 60)

          def flatten_emergency(em):
              """Flatten an emergency record. Nested locations/categories become semicolon lists."""
              locs = em.get("locations", []) or []
              cats = em.get("categories", []) or []
              return {
                  "ID":                em.get("id", ""),
                  "Name":              em.get("name", ""),
                  "Glide ID":          em.get("glideId", ""),
                  "Date":              (em.get("date") or "")[:10],
                  "Status":            em.get("status", ""),
                  "Country ISO3s":     "; ".join(l.get("iso3", "") for l in locs),
                  "Country Names":     "; ".join(l.get("name", "") for l in locs),
                  "Categories":        "; ".join(c.get("name", "") for c in cats),
              }

          print(f"Converting: {json_path}")
          with open(json_path) as f:
              raw = json.load(f)

          # Emergency endpoint returns either {"data": [...]} or {"data": {...}} for single
          data = raw.get("data", raw)

          if isinstance(data, list):
              records = data
          elif isinstance(data, dict):
              records = [data]
          else:
              print(f"Unexpected data type: {type(data)}")
              raise SystemExit(1)

          flat_rows = [flatten_emergency(e) for e in records]

          wb = openpyxl.Workbook()
          ws = wb.active
          ws.title = "Emergencies"

          if flat_rows:
              headers = list(flat_rows[0].keys())
              ws.append(headers)
              for row in flat_rows:
                  ws.append([row.get(h, "") for h in headers])
              style_header(ws)
              autofit(ws)
              ws.freeze_panes = "A2"

          xlsx_path = os.path.join(out_dir, f"{date_str}.xlsx")
          wb.save(xlsx_path)
          shutil.copy(xlsx_path, os.path.join(out_dir, "latest.xlsx"))
          print(f"Saved {len(flat_rows)} rows → {xlsx_path}")
          PYEOF

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: emergency-data-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}/${{ env.DATE }}.xlsx
          if-no-files-found: warn

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
              for slug in sorted(os.listdir(base)):
                  p = os.path.join(base, slug)
                  if not os.path.isdir(p):
                      continue
                  files = sorted(
                      f for f in os.listdir(p)
                      if not f.startswith("latest") and not f.startswith(".")
                  )
                  if not files:
                      continue
                  def ext_priority(fn):
                      e = fn.rsplit(".", 1)[-1]
                      return {"json": 0, "xlsx": 1, "xml": 2}.get(e, 3)
                  latest_file = sorted(files, key=ext_priority)[0]
                  ext = latest_file.rsplit(".", 1)[-1]
                  index[slug] = {
                      "latest":  f"{slug}/latest.{ext}",
                      "files":   [f"{slug}/{f}" for f in files],
                      "updated": latest_file.rsplit(".", 1)[0],
                  }
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
              json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: emergency $(date -u +%Y-%m-%d)"
          git push
