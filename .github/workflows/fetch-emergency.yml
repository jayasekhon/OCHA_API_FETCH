name: Fetch — Emergencies

on:
  workflow_dispatch:
    inputs:
      emergency_id:
        description: 'Emergency ID (numeric) — leave blank to fetch by year/country'
        required: false
        default: ''
      year:
        description: 'Year (e.g. 2025)'
        required: false
        default: ''
      country_iso3:
        description: 'Country ISO3 (e.g. SDN, UKR, SYR)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID: ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:  ${{ secrets.FTS_PASSWORD }}
          EMERGENCY_ID:  ${{ github.event.inputs.emergency_id || '' }}
          YEAR:          ${{ github.event.inputs.year || '' }}
          COUNTRY:       ${{ github.event.inputs.country_iso3 || '' }}
          FORMAT:        ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # Route to the correct endpoint
          if [ -n "$EMERGENCY_ID" ]; then
            URL="https://api.hpc.tools/v1/public/emergency/${EMERGENCY_ID}"
            SLUG="emergency_${EMERGENCY_ID}"
          elif [ -n "$COUNTRY" ]; then
            URL="https://api.hpc.tools/v1/public/emergency/country/${COUNTRY}"
            SLUG="emergency_${COUNTRY,,}"
            [ -n "$YEAR" ] && URL="${URL}?year=${YEAR}" && SLUG="${SLUG}_${YEAR}"
          elif [ -n "$YEAR" ]; then
            URL="https://api.hpc.tools/v1/public/emergency/year/${YEAR}"
            SLUG="emergency_${YEAR}"
          else
            echo "Error: provide at least one parameter"; exit 1
          fi

          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Saved $(wc -c < "$OUT_FILE") bytes to ${OUT_FILE}"

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
            for slug in sorted(os.listdir(base)):
              p = os.path.join(base, slug)
              if not os.path.isdir(p): continue
              files = sorted(f for f in os.listdir(p) if not f.startswith("latest") and not f.startswith("."))
              if not files: continue
              ext = files[-1].split('.')[-1]
              index[slug] = {"latest": f"{slug}/latest.{ext}", "files": [f"{slug}/{f}" for f in files], "updated": files[-1].replace(f".{ext}", "")}
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
            json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: emergency $(date -u +%Y-%m-%d)"
          git push
