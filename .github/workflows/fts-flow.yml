name: FTS — Flows

on:
  workflow_call:
    inputs:
      year:
        required: false
        type: string
        default: ''
      country_iso3:
        required: false
        type: string
        default: ''
      organization_abbrev:
        required: false
        type: string
        default: ''
      emergency_id:
        required: false
        type: string
        default: ''
      plan_id:
        required: false
        type: string
        default: ''
      plan_code:
        required: false
        type: string
        default: ''
      global_cluster_code:
        required: false
        type: string
        default: ''
      project_code:
        required: false
        type: string
        default: ''
      source_country_iso3:
        required: false
        type: string
        default: ''
      destination_country_iso3:
        required: false
        type: string
        default: ''
      source_org_abbrev:
        required: false
        type: string
        default: ''
      destination_org_abbrev:
        required: false
        type: string
        default: ''
      source_global_cluster_code:
        required: false
        type: string
        default: ''
      destination_global_cluster_code:
        required: false
        type: string
        default: ''
      group_by:
        required: false
        type: string
        default: ''
      format:
        required: false
        type: string
        default: 'json'
    secrets:
      FTS_CLIENT_ID:
        required: false
      FTS_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      # ── BOUNDARY ──────────────────────────────────────────────────────────
      year:
        description: 'Year (e.g. 2025)'
        required: false
        default: ''
      country_iso3:
        description: 'Country ISO3 (e.g. SDN, UKR, SYR) — source OR destination'
        required: false
        default: ''
      organization_abbrev:
        description: 'Organisation abbreviation (e.g. WFP, UNHCR) — source OR destination'
        required: false
        default: ''
      emergency_id:
        description: 'Emergency ID (numeric)'
        required: false
        default: ''
      plan_id:
        description: 'Plan ID (numeric)'
        required: false
        default: ''
      plan_code:
        description: 'Plan code (e.g. UKR23)'
        required: false
        default: ''
      global_cluster_code:
        description: 'Sector code (e.g. FSC, HEA, SHL, WSH, PRO, NUT, ETC, LOG, CCM, ERY)'
        required: false
        default: ''
      project_code:
        description: 'Project code'
        required: false
        default: ''

      # ── FILTERS ───────────────────────────────────────────────────────────
      source_country_iso3:
        description: 'Filter: source country ISO3'
        required: false
        default: ''
      destination_country_iso3:
        description: 'Filter: destination country ISO3'
        required: false
        default: ''
      source_org_abbrev:
        description: 'Filter: source organisation abbreviation (donor)'
        required: false
        default: ''
      destination_org_abbrev:
        description: 'Filter: destination organisation abbreviation (recipient)'
        required: false
        default: ''
      source_global_cluster_code:
        description: 'Filter: source sector code'
        required: false
        default: ''
      destination_global_cluster_code:
        description: 'Filter: destination sector code'
        required: false
        default: ''

      # ── GROUPING ──────────────────────────────────────────────────────────
      group_by:
        description: 'Group results by (leave blank for raw flows)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Organization
          - OrganizationType
          - Country
          - Plan
          - Emergency
          - Project
          - GlobalCluster
          - Cluster
          - Year
          - ProjectPriority
          - ProjectGenderMarker
          - ProjectResponseType

      # ── OUTPUT ────────────────────────────────────────────────────────────
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID:    ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:     ${{ secrets.FTS_PASSWORD }}
          YEAR:             ${{ github.event.inputs.year || '' }}
          COUNTRY:          ${{ github.event.inputs.country_iso3 || '' }}
          ORG:              ${{ github.event.inputs.organization_abbrev || '' }}
          EMERGENCY:        ${{ github.event.inputs.emergency_id || '' }}
          PLAN_ID:          ${{ github.event.inputs.plan_id || '' }}
          PLAN_CODE:        ${{ github.event.inputs.plan_code || '' }}
          CLUSTER:          ${{ github.event.inputs.global_cluster_code || '' }}
          PROJECT_CODE:     ${{ github.event.inputs.project_code || '' }}
          SRC_COUNTRY:      ${{ github.event.inputs.source_country_iso3 || '' }}
          DST_COUNTRY:      ${{ github.event.inputs.destination_country_iso3 || '' }}
          SRC_ORG:          ${{ github.event.inputs.source_org_abbrev || '' }}
          DST_ORG:          ${{ github.event.inputs.destination_org_abbrev || '' }}
          SRC_CLUSTER:      ${{ github.event.inputs.source_global_cluster_code || '' }}
          DST_CLUSTER:      ${{ github.event.inputs.destination_global_cluster_code || '' }}
          GROUP_BY:         ${{ github.event.inputs.group_by || '' }}
          FORMAT:           ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # ── Build boundary params ──────────────────────────────────────────
          PARAMS=""
          [ -n "$YEAR" ]         && PARAMS="${PARAMS}&year=${YEAR}"
          [ -n "$COUNTRY" ]      && PARAMS="${PARAMS}&countryISO3=${COUNTRY}"
          [ -n "$ORG" ]          && PARAMS="${PARAMS}&organizationAbbrev=${ORG}"
          [ -n "$EMERGENCY" ]    && PARAMS="${PARAMS}&emergencyId=${EMERGENCY}"
          [ -n "$PLAN_ID" ]      && PARAMS="${PARAMS}&planId=${PLAN_ID}"
          [ -n "$PLAN_CODE" ]    && PARAMS="${PARAMS}&planCode=${PLAN_CODE}"
          [ -n "$CLUSTER" ]      && PARAMS="${PARAMS}&globalClusterCode=${CLUSTER}"
          [ -n "$PROJECT_CODE" ] && PARAMS="${PARAMS}&projectCode=${PROJECT_CODE}"

          # ── Build filterBy params ──────────────────────────────────────────
          [ -n "$SRC_COUNTRY" ]  && PARAMS="${PARAMS}&filterBy=sourceCountryISO3:${SRC_COUNTRY}"
          [ -n "$DST_COUNTRY" ]  && PARAMS="${PARAMS}&filterBy=destinationCountryISO3:${DST_COUNTRY}"
          [ -n "$SRC_ORG" ]      && PARAMS="${PARAMS}&filterBy=sourceOrganizationAbbrev:${SRC_ORG}"
          [ -n "$DST_ORG" ]      && PARAMS="${PARAMS}&filterBy=destinationOrganizationAbbrev:${DST_ORG}"
          [ -n "$SRC_CLUSTER" ]  && PARAMS="${PARAMS}&filterBy=sourceGlobalClusterCode:${SRC_CLUSTER}"
          [ -n "$DST_CLUSTER" ]  && PARAMS="${PARAMS}&filterBy=destinationGlobalClusterCode:${DST_CLUSTER}"

          # ── Groupby ───────────────────────────────────────────────────────
          [ -n "$GROUP_BY" ]     && PARAMS="${PARAMS}&groupby=${GROUP_BY}"

          PARAMS="${PARAMS#&}"

          # ── Build slug for folder name ─────────────────────────────────────
          SLUG="flow"
          [ -n "$YEAR" ]         && SLUG="${SLUG}_${YEAR}"
          [ -n "$COUNTRY" ]      && SLUG="${SLUG}_${COUNTRY,,}"
          [ -n "$ORG" ]          && SLUG="${SLUG}_${ORG,,}"
          [ -n "$EMERGENCY" ]    && SLUG="${SLUG}_emergency${EMERGENCY}"
          [ -n "$PLAN_ID" ]      && SLUG="${SLUG}_plan${PLAN_ID}"
          [ -n "$PLAN_CODE" ]    && SLUG="${SLUG}_${PLAN_CODE,,}"
          [ -n "$CLUSTER" ]      && SLUG="${SLUG}_${CLUSTER,,}"
          [ -n "$SRC_ORG" ]      && SLUG="${SLUG}_from_${SRC_ORG,,}"
          [ -n "$DST_ORG" ]      && SLUG="${SLUG}_to_${DST_ORG,,}"
          [ -n "$SRC_COUNTRY" ]  && SLUG="${SLUG}_fromc_${SRC_COUNTRY,,}"
          [ -n "$DST_COUNTRY" ]  && SLUG="${SLUG}_toc_${DST_COUNTRY,,}"
          [ -n "$GROUP_BY" ]     && SLUG="${SLUG}_by_${GROUP_BY,,}"

          URL="https://api.hpc.tools/v1/public/fts/flow"
          [ -n "$PARAMS" ] && URL="${URL}?${PARAMS}"

          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"
          echo "Saving to: ${OUT_FILE}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Done — $(wc -c < "$OUT_FILE") bytes saved"

          # Export paths for subsequent steps
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_ENV
          echo "OUT_FILE=${OUT_FILE}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Convert JSON to Excel
        if: ${{ github.event.inputs.format != 'xml' }}
        run: |
          pip install openpyxl --quiet --break-system-packages
          python3 - << 'PYEOF'
          import json, os, openpyxl, shutil
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          json_path = os.environ["OUT_FILE"]
          out_dir   = os.environ["OUT_DIR"]
          date_str  = os.environ["DATE"]

          if not json_path.endswith(".json"):
              print("Not a JSON file — skipping Excel conversion")
              raise SystemExit(0)

          def style_header(ws):
              fill = PatternFill("solid", fgColor="1F3864")
              font = Font(color="FFFFFF", bold=True)
              for cell in ws[1]:
                  cell.fill = fill
                  cell.font = font
                  cell.alignment = Alignment(horizontal="center")

          def autofit(ws):
              for col in ws.columns:
                  max_len = max((len(str(c.value or "")) for c in col), default=10)
                  ws.column_dimensions[get_column_letter(col[0].column)].width = min(max_len + 4, 60)

          def flatten_flow(flow):
              """Flatten a single raw FTS flow record into a dict of scalar values."""
              def names(items, key="name"):
                  return "; ".join(str(i.get(key, "")) for i in (items or []))
              def codes(items, key="iso3"):
                  return "; ".join(str(i.get(key, "")) for i in (items or []))

              src_orgs  = flow.get("sourceObjects",      []) or flow.get("sourceOrganizations",      [])
              dst_orgs  = flow.get("destinationObjects", []) or flow.get("destinationOrganizations", [])
              # Filter to Organisation type for source/dest org names
              src_org_objs  = [o for o in src_orgs  if o.get("type") == "Organization"]
              dst_org_objs  = [o for o in dst_orgs  if o.get("type") == "Organization"]
              src_loc_objs  = [o for o in src_orgs  if o.get("type") == "Location"]
              dst_loc_objs  = [o for o in dst_orgs  if o.get("type") == "Location"]

              return {
                  "Flow ID":                   flow.get("id", ""),
                  "Amount (USD)":              flow.get("amountUSD", ""),
                  "Original Amount":           flow.get("originalAmount", ""),
                  "Original Currency":         flow.get("originalCurrency", ""),
                  "Exchange Rate":             flow.get("exchangeRate", ""),
                  "Budget Year":               flow.get("budgetYear", ""),
                  "Flow Date":                 (flow.get("date") or flow.get("flowDate") or "")[:10],
                  "Decision Date":             (flow.get("decisionDate") or "")[:10],
                  "Status":                    flow.get("status", ""),
                  "Flow Type":                 flow.get("flowType", ""),
                  "Contribution Type":         flow.get("contributionType", ""),
                  "Method":                    flow.get("method", ""),
                  "New Money":                 flow.get("newMoney", ""),
                  "Description":               flow.get("description", ""),
                  "Source Organisations":      names(src_org_objs),
                  "Source Countries":          names(src_loc_objs),
                  "Source Country ISO3":       codes(src_loc_objs),
                  "Destination Organisations": names(dst_org_objs),
                  "Destination Countries":     names(dst_loc_objs),
                  "Destination Country ISO3":  codes(dst_loc_objs),
              }

          def flatten_grouped_item(item):
              """Flatten a single item from a groupby result."""
              return {
                  "Name":           item.get("name", item.get("code", str(item.get("id", "")))),
                  "Type":           item.get("type", item.get("organizationTypeName", "")),
                  "ID":             item.get("id", ""),
                  "ISO3":           item.get("iso3", item.get("countryCode", "")),
                  "Total (USD)":    item.get("totalFunding", item.get("totalFundingUSD", "")),
                  "Single (USD)":   item.get("singleFunding", ""),
                  "Overlap (USD)":  item.get("overlapFunding", ""),
                  "Shared (USD)":   item.get("sharedFunding", ""),
                  "Flow Count":     item.get("flowCount", ""),
              }

          print(f"Converting: {json_path}")
          with open(json_path) as f:
              raw = json.load(f)

          data = raw.get("data", raw)  # some endpoints return data at root

          wb = openpyxl.Workbook()
          ws = wb.active
          ws.title = "Data"

          # ── Detect response structure ──────────────────────────────────────
          # Structure A: raw flows list  →  data.flows  (no groupby)
          # Structure B: grouped result  →  data.incoming/outgoing/internal + data.flows
          # Structure C: donors/grouped  →  data.report1..reportN  (handled by fetch-donors)

          if "flows" in data:
              # Raw or grouped flows response
              flows = data["flows"]
              flat_rows = [flatten_flow(f) for f in flows]

              # Also add summary rows for incoming/outgoing if present
              wb.remove(ws)
              ws_flows = wb.create_sheet("Flows")
              if flat_rows:
                  headers = list(flat_rows[0].keys())
                  ws_flows.append(headers)
                  for row in flat_rows:
                      ws_flows.append([row.get(h, "") for h in headers])
                  style_header(ws_flows)
                  autofit(ws_flows)
                  ws_flows.freeze_panes = "A2"

              # Add summary sheet
              ws_sum = wb.create_sheet("Summary", 0)
              ws_sum.append(["Direction", "Flow Count", "Funding Total (USD)", "Pledge Total (USD)"])
              for direction in ["incoming", "outgoing", "internal"]:
                  d = data.get(direction, {})
                  if d:
                      ws_sum.append([
                          direction.title(),
                          d.get("flowCount", ""),
                          d.get("fundingTotal", ""),
                          d.get("pledgeTotal", ""),
                      ])
              style_header(ws_sum)
              autofit(ws_sum)
              print(f"  Flows sheet: {len(flat_rows)} rows")

          elif any(k.startswith("report") for k in data.keys()):
              # This is a donors/grouped response — should be handled by fetch-donors
              # but handle it here as a fallback
              wb.remove(ws)
              all_rows = []
              for rk in sorted(k for k in data.keys() if k.startswith("report")):
                  rd = data[rk]
                  rows = []
                  for totals_key in ["fundingTotals", "pledgeTotals"]:
                      totals = rd.get(totals_key, {})
                      for group_obj in totals.get("objects", []):
                          for bd in group_obj.get("objectsBreakdown", []):
                              bd["_report"] = rk
                              bd["_totals_type"] = totals_key
                              rows.append(flatten_grouped_item(bd))
                  all_rows.extend(rows)
                  sheet_ws = wb.create_sheet(rk[:31])
                  if rows:
                      headers = list(rows[0].keys())
                      sheet_ws.append(headers)
                      for row in rows:
                          sheet_ws.append([row.get(h, "") for h in headers])
                      style_header(sheet_ws)
                      autofit(sheet_ws)
                      sheet_ws.freeze_panes = "A2"
              flat_rows = all_rows

          elif isinstance(data, list):
              # Simple list response (e.g. emergency, location)
              flat_rows = data  # already flat dicts
              if flat_rows:
                  headers = list(flat_rows[0].keys()) if isinstance(flat_rows[0], dict) else ["value"]
                  ws.append(headers)
                  for row in flat_rows:
                      if isinstance(row, dict):
                          ws.append([row.get(h, "") for h in headers])
                      else:
                          ws.append([row])
                  style_header(ws)
                  autofit(ws)
                  ws.freeze_panes = "A2"

          else:
              print(f"Unrecognised JSON structure — keys: {list(data.keys())}")
              raise SystemExit(1)

          xlsx_path = os.path.join(out_dir, f"{date_str}.xlsx")
          wb.save(xlsx_path)
          shutil.copy(xlsx_path, os.path.join(out_dir, "latest.xlsx"))
          print(f"Saved → {xlsx_path}")
          PYEOF

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-data-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}/${{ env.DATE }}.xlsx
          if-no-files-found: warn

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
              for slug in sorted(os.listdir(base)):
                  p = os.path.join(base, slug)
                  if not os.path.isdir(p):
                      continue
                  files = sorted(
                      f for f in os.listdir(p)
                      if not f.startswith("latest") and not f.startswith(".")
                  )
                  if not files:
                      continue
                  def ext_priority(fn):
                      e = fn.rsplit(".", 1)[-1]
                      return {"json": 0, "xlsx": 1, "xml": 2}.get(e, 3)
                  latest_file = sorted(files, key=ext_priority)[0]
                  ext = latest_file.rsplit(".", 1)[-1]
                  index[slug] = {
                      "latest":  f"{slug}/latest.{ext}",
                      "files":   [f"{slug}/{f}" for f in files],
                      "updated": latest_file.rsplit(".", 1)[0],
                  }
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
              json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: flow $(date -u +%Y-%m-%d)"
          git push
