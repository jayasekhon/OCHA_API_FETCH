name: Scheduled — Daily Fetch

# ─────────────────────────────────────────────────────────────────────────────
# MASTER SCHEDULE
# Add or remove jobs below to control what gets fetched automatically each day.
# Each job calls the relevant workflow with the parameters you want.
# All times are UTC. GitHub runs the cron at 07:00 UTC daily.
#
# HOW TO ADD A NEW SCHEDULED FETCH:
#   1. Copy an existing job block below
#   2. Give it a unique job name (e.g. funding-2026-ukr)
#   3. Point `uses:` at the right workflow file
#   4. Set `with:` parameters as needed — omit any you don't need
#
# AVAILABLE WORKFLOWS:
#   ./.github/workflows/fetch-funding.yml      → year, country_iso3, emergency_id, plan_id, destination_org_abbrev, destination_global_cluster_code, format
#   ./.github/workflows/fetch-flow.yml         → year, country_iso3, organization_abbrev, emergency_id, plan_id, plan_code, global_cluster_code, source_org_abbrev, destination_org_abbrev, group_by, format
#   ./.github/workflows/fetch-emergency.yml    → emergency_id, year, country_iso3, format
#   ./.github/workflows/fetch-plan.yml         → plan_id, plan_code, year, country_iso3, format
#   ./.github/workflows/fetch-location.yml     → format
#   ./.github/workflows/fetch-organization.yml → format
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch:        # allow manual trigger for testing

jobs:

  # ── FUNDING ────────────────────────────────────────────────────────────────

  funding-2026-global:
    name: Funding 2026 (Global)
    uses: ./.github/workflows/fetch-funding.yml
    with:
      year: '2026'
      format: 'json'
    secrets: inherit

