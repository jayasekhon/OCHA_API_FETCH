name: Fetch — Funding

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2025) — required'
        required: true
        default: '2025'
      country_iso3:
        description: 'Country ISO3 (e.g. SDN, UKR) — leave blank for global'
        required: false
        default: ''
      emergency_id:
        description: 'Emergency ID (numeric) — leave blank for all'
        required: false
        default: ''
      plan_id:
        description: 'Plan ID (numeric) — leave blank for all'
        required: false
        default: ''
      destination_org_abbrev:
        description: 'Filter to a specific recipient organisation (e.g. WFP)'
        required: false
        default: ''
      destination_global_cluster_code:
        description: 'Filter to a specific destination sector (e.g. HEA, FSC, WSH)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID: ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:  ${{ secrets.FTS_PASSWORD }}
          YEAR:          ${{ github.event.inputs.year }}
          COUNTRY:       ${{ github.event.inputs.country_iso3 || '' }}
          EMERGENCY:     ${{ github.event.inputs.emergency_id || '' }}
          PLAN_ID:       ${{ github.event.inputs.plan_id || '' }}
          DST_ORG:       ${{ github.event.inputs.destination_org_abbrev || '' }}
          DST_CLUSTER:   ${{ github.event.inputs.destination_global_cluster_code || '' }}
          FORMAT:        ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          PARAMS="year=${YEAR}&groupby=Organization"
          [ -n "$COUNTRY" ]     && PARAMS="${PARAMS}&countryISO3=${COUNTRY}"
          [ -n "$EMERGENCY" ]   && PARAMS="${PARAMS}&emergencyId=${EMERGENCY}"
          [ -n "$PLAN_ID" ]     && PARAMS="${PARAMS}&planId=${PLAN_ID}"
          [ -n "$DST_ORG" ]     && PARAMS="${PARAMS}&filterBy=destinationOrganizationAbbrev:${DST_ORG}"
          [ -n "$DST_CLUSTER" ] && PARAMS="${PARAMS}&filterBy=destinationGlobalClusterCode:${DST_CLUSTER}"

          SLUG="funding_${YEAR}"
          [ -n "$COUNTRY" ]     && SLUG="${SLUG}_${COUNTRY,,}"
          [ -n "$EMERGENCY" ]   && SLUG="${SLUG}_emergency${EMERGENCY}"
          [ -n "$PLAN_ID" ]     && SLUG="${SLUG}_plan${PLAN_ID}"
          [ -n "$DST_ORG" ]     && SLUG="${SLUG}_to_${DST_ORG,,}"
          [ -n "$DST_CLUSTER" ] && SLUG="${SLUG}_${DST_CLUSTER,,}"

          URL="https://api.hpc.tools/v1/public/fts/flow?${PARAMS}"
          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"
          echo "Saving to: ${OUT_FILE}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Done — $(wc -c < "$OUT_FILE") bytes saved"

          # Export paths for subsequent steps
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_ENV
          echo "OUT_FILE=${OUT_FILE}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Convert JSON to Excel
        if: ${{ github.event.inputs.format != 'xml' }}
        run: |
          pip install openpyxl --quiet --break-system-packages
          python3 - << 'PYEOF'
          import json, os, openpyxl, shutil
          from openpyxl.styles import Font, PatternFill, Alignment, numbers
          from openpyxl.utils import get_column_letter

          json_path = os.environ["OUT_FILE"]
          out_dir   = os.environ["OUT_DIR"]
          date_str  = os.environ["DATE"]

          if not json_path.endswith(".json"):
              print("Not a JSON file — skipping Excel conversion")
              raise SystemExit(0)

          def style_header(ws):
              fill = PatternFill("solid", fgColor="1F3864")
              font = Font(color="FFFFFF", bold=True)
              for cell in ws[1]:
                  cell.fill = fill
                  cell.font = font
                  cell.alignment = Alignment(horizontal="center")

          def autofit(ws):
              for col in ws.columns:
                  max_len = max((len(str(c.value or "")) for c in col), default=10)
                  ws.column_dimensions[get_column_letter(col[0].column)].width = min(max_len + 4, 60)

          def write_funding_sheet(wb, title, rows, grand_total):
              """
              Write a funding sheet with % share column.
              grand_total is the sum of all totalFunding values for this report,
              used to calculate the % share column.
              """
              ws = wb.create_sheet(title=title[:31])
              if not rows:
                  ws.append(["No data"])
                  return

              headers = [
                  "Organisation ID",
                  "Organisation Name",
                  "Direction",
                  "Total Funding (USD)",
                  "% of Total",
                  "Single Funding (USD)",
                  "Overlap Funding (USD)",
                  "Shared Funding (USD)",
                  "Type",
              ]
              ws.append(headers)

              for row in rows:
                  total = row.get("Total Funding (USD)", 0) or 0
                  pct   = (total / grand_total) if grand_total else 0
                  ws.append([
                      row.get("Organisation ID", ""),
                      row.get("Organisation Name", ""),
                      row.get("Direction", ""),
                      total,
                      pct,
                      row.get("Single Funding (USD)", ""),
                      row.get("Overlap Funding (USD)", ""),
                      row.get("Shared Funding (USD)", ""),
                      row.get("Org Type", ""),
                  ])

              # Format numeric and percentage columns
              for row in ws.iter_rows(min_row=2, max_row=ws.max_row):
                  row[3].number_format = '#,##0'       # Total Funding
                  row[4].number_format = '0.0%'        # % of Total
                  row[5].number_format = '#,##0'       # Single Funding
                  row[6].number_format = '#,##0'       # Overlap Funding
                  row[7].number_format = '#,##0'       # Shared Funding

              style_header(ws)
              autofit(ws)
              ws.freeze_panes = "A2"

          def flatten_report(report_data):
              """
              Extract rows from a single reportN block (fundingTotals only —
              pledgeTotals are usually empty and clutter the output).
              Returns (rows, grand_total).
              """
              rows = []
              totals      = report_data.get("fundingTotals", {})
              grand_total = totals.get("total", 0) or 0
              for group_obj in totals.get("objects", []):
                  direction = group_obj.get("direction", "")
                  for bd in group_obj.get("objectsBreakdown", []):
                      rows.append({
                          "Organisation ID":       bd.get("id", ""),
                          "Organisation Name":     bd.get("name", ""),
                          "Direction":             direction,
                          "Org Type":              bd.get("type", ""),
                          "Total Funding (USD)":   bd.get("totalFunding", 0) or 0,
                          "Single Funding (USD)":  bd.get("singleFunding", 0) or 0,
                          "Overlap Funding (USD)": bd.get("overlapFunding", 0) or 0,
                          "Shared Funding (USD)":  bd.get("sharedFunding", 0) or 0,
                      })
              rows.sort(key=lambda r: r["Total Funding (USD)"], reverse=True)
              return rows, grand_total

          print(f"Converting: {json_path}")
          with open(json_path) as f:
              raw = json.load(f)

          data = raw.get("data", {})
          report_keys = sorted(k for k in data.keys() if k.startswith("report"))
          if not report_keys:
              print("No reportN keys found — skipping")
              raise SystemExit(0)

          # Sheet names that match what the FTS website shows
          report_labels = {
              "report1": "Donors",  # source orgs grouped by incoming flows
              "report2": "Recipients",  # dest orgs, all incoming
              "report3": "Recipients (Net)",  # dest orgs net of outgoing
              "report4": "Global / GHO Recipients",  # outgoing to GHO-tracked destinations
          }

          wb = openpyxl.Workbook()
          wb.remove(wb.active)

          all_rows     = []
          total_rows   = 0

          for rk in report_keys:
              label = report_labels.get(rk, rk)
              rows, grand_total = flatten_report(data[rk])
              total_rows += len(rows)

              # Annotate rows with report label for the combined sheet
              for r in rows:
                  r["Report"] = label
              all_rows.extend(rows)

              write_funding_sheet(wb, label, rows, grand_total)

          # Combined sheet at the front
          if all_rows:
              ws_all = wb.create_sheet("All Reports", 0)
              headers = [
                  "Report", "Organisation ID", "Organisation Name", "Direction",
                  "Total Funding (USD)", "% of Total",
                  "Single Funding (USD)", "Overlap Funding (USD)", "Shared Funding (USD)",
                  "Org Type",
              ]
              ws_all.append(headers)
              report_totals = {}
              for rk in report_keys:
                  t = data[rk].get("fundingTotals", {}).get("total", 0) or 0
                  report_totals[report_labels.get(rk, rk)] = t

              for row in all_rows:
                  gt = report_totals.get(row.get("Report", ""), 0)
                  total = row.get("Total Funding (USD)", 0) or 0
                  pct   = (total / gt) if gt else 0
                  ws_all.append([
                      row.get("Report", ""),
                      row.get("Organisation ID", ""),
                      row.get("Organisation Name", ""),
                      row.get("Direction", ""),
                      total,
                      pct,
                      row.get("Single Funding (USD)", ""),
                      row.get("Overlap Funding (USD)", ""),
                      row.get("Shared Funding (USD)", ""),
                      row.get("Org Type", ""),
                  ])

              for row in ws_all.iter_rows(min_row=2, max_row=ws_all.max_row):
                  row[4].number_format = '#,##0'
                  row[5].number_format = '0.0%'
                  row[6].number_format = '#,##0'
                  row[7].number_format = '#,##0'
                  row[8].number_format = '#,##0'

              style_header(ws_all)
              autofit(ws_all)
              ws_all.freeze_panes = "A2"

          xlsx_path = os.path.join(out_dir, f"{date_str}.xlsx")
          wb.save(xlsx_path)
          shutil.copy(xlsx_path, os.path.join(out_dir, "latest.xlsx"))
          print(f"Saved {total_rows} rows across {len(report_keys)} report sheets → {xlsx_path}")
          PYEOF

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: funding-data-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}/${{ env.DATE }}.xlsx
          if-no-files-found: warn

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
              for slug in sorted(os.listdir(base)):
                  p = os.path.join(base, slug)
                  if not os.path.isdir(p):
                      continue
                  files = sorted(
                      f for f in os.listdir(p)
                      if not f.startswith("latest") and not f.startswith(".")
                  )
                  if not files:
                      continue
                  def ext_priority(fn):
                      e = fn.rsplit(".", 1)[-1]
                      return {"json": 0, "xlsx": 1, "xml": 2}.get(e, 3)
                  latest_file = sorted(files, key=ext_priority)[0]
                  ext = latest_file.rsplit(".", 1)[-1]
                  index[slug] = {
                      "latest":  f"{slug}/latest.{ext}",
                      "files":   [f"{slug}/{f}" for f in files],
                      "updated": latest_file.rsplit(".", 1)[0],
                  }
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
              json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: funding $(date -u +%Y-%m-%d)"
          git push
