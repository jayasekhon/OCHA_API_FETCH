name: Fetch — Funding by Donor

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2025) — required'
        required: true
        default: '2025'
      country_iso3:
        description: 'Limit to a specific country ISO3 (e.g. SDN) — leave blank for global'
        required: false
        default: ''
      emergency_id:
        description: 'Limit to a specific emergency ID — leave blank for all'
        required: false
        default: ''
      plan_id:
        description: 'Limit to a specific plan ID — leave blank for all'
        required: false
        default: ''
      destination_org_abbrev:
        description: 'Filter to a specific recipient organisation (e.g. WFP)'
        required: false
        default: ''
      destination_global_cluster_code:
        description: 'Filter to a specific destination sector (e.g. HEA, FSC, WSH)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID:  ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:   ${{ secrets.FTS_PASSWORD }}
          YEAR:           ${{ github.event.inputs.year }}
          COUNTRY:        ${{ github.event.inputs.country_iso3 || '' }}
          EMERGENCY:      ${{ github.event.inputs.emergency_id || '' }}
          PLAN_ID:        ${{ github.event.inputs.plan_id || '' }}
          DST_ORG:        ${{ github.event.inputs.destination_org_abbrev || '' }}
          DST_CLUSTER:    ${{ github.event.inputs.destination_global_cluster_code || '' }}
          FORMAT:         ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # Always group by source organisation = donor totals
          PARAMS="year=${YEAR}&groupby=Organization"
          [ -n "$COUNTRY" ]   && PARAMS="${PARAMS}&countryISO3=${COUNTRY}"
          [ -n "$EMERGENCY" ] && PARAMS="${PARAMS}&emergencyId=${EMERGENCY}"
          [ -n "$PLAN_ID" ]   && PARAMS="${PARAMS}&planId=${PLAN_ID}"
          [ -n "$DST_ORG" ]   && PARAMS="${PARAMS}&filterBy=destinationOrganizationAbbrev:${DST_ORG}"
          [ -n "$DST_CLUSTER" ] && PARAMS="${PARAMS}&filterBy=destinationGlobalClusterCode:${DST_CLUSTER}"

          SLUG="donors_${YEAR}"
          [ -n "$COUNTRY" ]   && SLUG="${SLUG}_${COUNTRY,,}"
          [ -n "$EMERGENCY" ] && SLUG="${SLUG}_emergency${EMERGENCY}"
          [ -n "$PLAN_ID" ]   && SLUG="${SLUG}_plan${PLAN_ID}"
          [ -n "$DST_ORG" ]   && SLUG="${SLUG}_to_${DST_ORG,,}"
          [ -n "$DST_CLUSTER" ] && SLUG="${SLUG}_${DST_CLUSTER,,}"

          URL="https://api.hpc.tools/v1/public/fts/flow?${PARAMS}"
          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"
          echo "Saving to: ${OUT_FILE}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Done — $(wc -c < "$OUT_FILE") bytes saved"

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
            for slug in sorted(os.listdir(base)):
              p = os.path.join(base, slug)
              if not os.path.isdir(p): continue
              files = sorted(f for f in os.listdir(p) if not f.startswith("latest") and not f.startswith("."))
              if not files: continue
              ext = files[-1].split('.')[-1]
              index[slug] = {"latest": f"{slug}/latest.{ext}", "files": [f"{slug}/{f}" for f in files], "updated": files[-1].replace(f".{ext}", "")}
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
            json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: donors $(date -u +%Y-%m-%d)"
          git push
