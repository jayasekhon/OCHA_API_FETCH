name: Fetch — Funding by Donor

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2025) — required'
        required: true
        default: '2025'
      country_iso3:
        description: 'Country ISO3 (e.g. SDN, UKR) — leave blank for global'
        required: false
        default: ''
      emergency_id:
        description: 'Emergency ID (numeric) — leave blank for all'
        required: false
        default: ''
      plan_id:
        description: 'Plan ID (numeric) — leave blank for all'
        required: false
        default: ''
      destination_org_abbrev:
        description: 'Filter to a specific recipient organisation (e.g. WFP)'
        required: false
        default: ''
      destination_global_cluster_code:
        description: 'Filter to a specific destination sector (e.g. HEA, FSC, WSH)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Fetch and save
        env:
          FTS_CLIENT_ID: ${{ secrets.FTS_CLIENT_ID }}
          FTS_PASSWORD:  ${{ secrets.FTS_PASSWORD }}
          YEAR:          ${{ github.event.inputs.year }}
          COUNTRY:       ${{ github.event.inputs.country_iso3 || '' }}
          EMERGENCY:     ${{ github.event.inputs.emergency_id || '' }}
          PLAN_ID:       ${{ github.event.inputs.plan_id || '' }}
          DST_ORG:       ${{ github.event.inputs.destination_org_abbrev || '' }}
          DST_CLUSTER:   ${{ github.event.inputs.destination_global_cluster_code || '' }}
          FORMAT:        ${{ github.event.inputs.format || 'json' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          PARAMS="year=${YEAR}&groupby=Organization"
          [ -n "$COUNTRY" ]     && PARAMS="${PARAMS}&countryISO3=${COUNTRY}"
          [ -n "$EMERGENCY" ]   && PARAMS="${PARAMS}&emergencyId=${EMERGENCY}"
          [ -n "$PLAN_ID" ]     && PARAMS="${PARAMS}&planId=${PLAN_ID}"
          [ -n "$DST_ORG" ]     && PARAMS="${PARAMS}&filterBy=destinationOrganizationAbbrev:${DST_ORG}"
          [ -n "$DST_CLUSTER" ] && PARAMS="${PARAMS}&filterBy=destinationGlobalClusterCode:${DST_CLUSTER}"

          SLUG="donors_${YEAR}"
          [ -n "$COUNTRY" ]     && SLUG="${SLUG}_${COUNTRY,,}"
          [ -n "$EMERGENCY" ]   && SLUG="${SLUG}_emergency${EMERGENCY}"
          [ -n "$PLAN_ID" ]     && SLUG="${SLUG}_plan${PLAN_ID}"
          [ -n "$DST_ORG" ]     && SLUG="${SLUG}_to_${DST_ORG,,}"
          [ -n "$DST_CLUSTER" ] && SLUG="${SLUG}_${DST_CLUSTER,,}"

          URL="https://api.hpc.tools/v1/public/fts/flow?${PARAMS}"
          OUT_DIR="data/${SLUG}"
          mkdir -p "$OUT_DIR"
          OUT_FILE="${OUT_DIR}/${DATE}.${FORMAT}"

          echo "Fetching: ${URL}"
          echo "Saving to: ${OUT_FILE}"

          if [ -n "$FTS_CLIENT_ID" ] && [ -n "$FTS_PASSWORD" ]; then
            STATUS=$(curl -s -w "%{http_code}" -u "${FTS_CLIENT_ID}:${FTS_PASSWORD}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          else
            STATUS=$(curl -s -w "%{http_code}" \
              -H "Accept: application/${FORMAT}" -o "$OUT_FILE" "$URL")
          fi

          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then cat "$OUT_FILE"; exit 1; fi

          cp "$OUT_FILE" "${OUT_DIR}/latest.${FORMAT}"
          echo "Done — $(wc -c < "$OUT_FILE") bytes saved"

          # Export paths for subsequent steps
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_ENV
          echo "OUT_FILE=${OUT_FILE}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Convert JSON to Excel
        if: ${{ github.event.inputs.format != 'xml' }}
        run: |
          pip install openpyxl --quiet --break-system-packages
          python3 - << 'PYEOF'
          import json, os, openpyxl, shutil
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          json_path = os.environ["OUT_FILE"]
          out_dir   = os.environ["OUT_DIR"]
          date_str  = os.environ["DATE"]

          if not json_path.endswith(".json"):
              print("Not a JSON file — skipping Excel conversion")
              raise SystemExit(0)

          def style_header(ws):
              fill = PatternFill("solid", fgColor="1F3864")
              font = Font(color="FFFFFF", bold=True)
              for cell in ws[1]:
                  cell.fill = fill
                  cell.font = font
                  cell.alignment = Alignment(horizontal="center")

          def autofit(ws):
              for col in ws.columns:
                  max_len = max((len(str(c.value or "")) for c in col), default=10)
                  ws.column_dimensions[get_column_letter(col[0].column)].width = min(max_len + 4, 60)

          def write_sheet(wb, title, rows):
              ws = wb.create_sheet(title=title[:31])
              if not rows:
                  ws.append(["No data"])
                  return
              headers = list(rows[0].keys())
              ws.append(headers)
              for row in rows:
                  ws.append([row.get(h, "") for h in headers])
              style_header(ws)
              autofit(ws)
              ws.freeze_panes = "A2"

          def flatten_donor_report(report_data, label):
              """
              Each reportN has fundingTotals and pledgeTotals.
              fundingTotals.objects is a list of grouping objects, each with objectsBreakdown.
              We flatten objectsBreakdown into rows.
              """
              rows = []
              for totals_key, totals_label in [("fundingTotals", "Funding"), ("pledgeTotals", "Pledges")]:
                  totals = report_data.get(totals_key, {})
                  grand_total = totals.get("total", 0)
                  for group_obj in totals.get("objects", []):
                      direction = group_obj.get("direction", "")
                      for bd in group_obj.get("objectsBreakdown", []):
                          rows.append({
                              "Type":                   totals_label,
                              "Report":                 label,
                              "Direction":              direction,
                              "Organisation ID":        bd.get("id", ""),
                              "Organisation Name":      bd.get("name", ""),
                              "Org Type":               bd.get("type", ""),
                              "Total Funding (USD)":    bd.get("totalFunding", ""),
                              "Single Funding (USD)":   bd.get("singleFunding", ""),
                              "Overlap Funding (USD)":  bd.get("overlapFunding", ""),
                              "Shared Funding (USD)":   bd.get("sharedFunding", ""),
                              "On Boundary (USD)":      bd.get("onBoundaryFunding", ""),
                              "Grand Total (USD)":      grand_total,
                          })
              return rows

          print(f"Converting: {json_path}")
          with open(json_path) as f:
              raw = json.load(f)

          data = raw.get("data", {})

          # Donors endpoint returns data.report1 / report2 / report3 / report4
          report_keys = [k for k in data.keys() if k.startswith("report")]
          if not report_keys:
              print("No reportN keys found — skipping")
              raise SystemExit(0)

          # Human-readable labels for each report
          report_labels = {
              "report1": "Source Organisations (Donors)",
              "report2": "Dest Organisations (Recipients)",
              "report3": "Dest Organisations (Alt)",
              "report4": "Global Recipients",
          }

          wb = openpyxl.Workbook()
          wb.remove(wb.active)  # remove default sheet

          all_rows = []
          for rk in sorted(report_keys):
              label = report_labels.get(rk, rk)
              rows = flatten_donor_report(data[rk], label)
              all_rows.extend(rows)
              write_sheet(wb, label[:31], rows)

          # Also write a combined summary sheet at the front
          if all_rows:
              wb_sheets = wb.sheetnames
              ws_summary = wb.create_sheet("All Reports", 0)
              headers = list(all_rows[0].keys())
              ws_summary.append(headers)
              for row in all_rows:
                  ws_summary.append([row.get(h, "") for h in headers])
              style_header(ws_summary)
              autofit(ws_summary)
              ws_summary.freeze_panes = "A2"

          xlsx_path = os.path.join(out_dir, f"{date_str}.xlsx")
          wb.save(xlsx_path)
          shutil.copy(xlsx_path, os.path.join(out_dir, "latest.xlsx"))
          print(f"Saved {len(all_rows)} rows across {len(report_keys)} report sheets → {xlsx_path}")
          PYEOF

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: donor-data-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}/${{ env.DATE }}.xlsx
          if-no-files-found: warn

      - name: Rebuild index
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime
          base = "data"
          index = {}
          if os.path.isdir(base):
              for slug in sorted(os.listdir(base)):
                  p = os.path.join(base, slug)
                  if not os.path.isdir(p):
                      continue
                  # Include all data files (json, xml, xlsx) but not latest.* files
                  files = sorted(
                      f for f in os.listdir(p)
                      if not f.startswith("latest")
                      and not f.startswith(".")
                  )
                  if not files:
                      continue
                  # Prefer json for the "latest" pointer, then xlsx, then xml
                  def ext_priority(fn):
                      e = fn.rsplit(".", 1)[-1]
                      return {"json": 0, "xlsx": 1, "xml": 2}.get(e, 3)
                  latest_file = sorted(files, key=ext_priority)[0]
                  ext = latest_file.rsplit(".", 1)[-1]
                  index[slug] = {
                      "latest": f"{slug}/latest.{ext}",
                      "files":  [f"{slug}/{f}" for f in files],
                      "updated": latest_file.rsplit(".", 1)[0],
                  }
          os.makedirs(base, exist_ok=True)
          with open(os.path.join(base, "index.json"), "w") as f:
              json.dump({"generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "datasets": index}, f, indent=2)
          print(f"Index written — {len(index)} dataset(s)")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "data: donors $(date -u +%Y-%m-%d)"
          git push
